<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090619">
    <title>GAMEQUIZ | Concurso de preguntas</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <header class="barra-superior">
        <a class="marca" href="index.html" aria-label="GAMEQUIZ, inicio">
            <span class="marca-acento">GAMEQUIZ</span>
        </a>
    </header>

    <main class="inicio">
        <h1>Empieza a jugar a <span>GAMEQUIZ</span></h1>

        <form id="formInicio" class="tarjeta-acceso">
            <label for="nickname">Tu nombre: </label>
            <input type="text" id="nickname" placeholder="Marina" autocomplete="nickname" required>
            <button class="boton-principal" type="submit">Iniciar juego</button>
        </form>
    </main>

    <script src="js/inicio.js"></script>
</body>

</html>
